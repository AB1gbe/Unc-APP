# Publishes the Cloudflare TEST site (unc.b1gbe.org) every time `main`
# changes (session 79). See docs/Build Guide/Step 69 - Cloudflare test site.md.
# Needs these repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token ("Edit Cloudflare Workers" + DNS edit for b1gbe.org)
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
#   UNC_ADMIN_PASSWORD     the admin password for the test site
#   UNC_SECRET_PEPPER      any long random text; never change it once set
# Without CLOUDFLARE_API_TOKEN the job skips (no red X).
name: Cloudflare test site
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: cloudflare-test
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Skip until the Cloudflare key is added
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No CLOUDFLARE_API_TOKEN secret yet: skipping."; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != '1'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != '1'
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: steps.check.outputs.skip != '1'
        run: npm ci
      - name: Server tests must pass first
        if: steps.check.outputs.skip != '1'
        run: npm test
      - name: Build the website and demo photos
        if: steps.check.outputs.skip != '1'
        run: node scripts/cloudflare-build.mjs
      - name: Publish to Cloudflare
        if: steps.check.outputs.skip != '1'
        working-directory: cloudflare
        run: npx wrangler deploy
      - name: Admin password and pepper (stored as Cloudflare secrets)
        if: steps.check.outputs.skip != '1'
        working-directory: cloudflare
        env:
          UNC_ADMIN_PASSWORD: ${{ secrets.UNC_ADMIN_PASSWORD }}
          UNC_SECRET_PEPPER: ${{ secrets.UNC_SECRET_PEPPER }}
        run: |
          if [ -n "$UNC_ADMIN_PASSWORD" ]; then printf '%s' "$UNC_ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD; fi
          if [ -n "$UNC_SECRET_PEPPER" ]; then printf '%s' "$UNC_SECRET_PEPPER" | npx wrangler secret put SECRET_PEPPER; fi
